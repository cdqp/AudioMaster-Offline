name: Feature request
description: Suggest a new tool, preset or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the result you are after (e.g. "export MP3", "a preset for podcasts").
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Ideas, references, similar tools.
